security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\JwtAuthenticator
        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/events, roles: PUBLIC_ACCESS }
        - { path: ^/api/news, roles: PUBLIC_ACCESS }
        - { path: ^/api/projects, roles: PUBLIC_ACCESS }
        - { path: ^/api/gallery, roles: PUBLIC_ACCESS }
        - { path: ^/api/partners, roles: PUBLIC_ACCESS }
        - { path: ^/api/testimonials, roles: PUBLIC_ACCESS }
        - { path: ^/api/documents, roles: PUBLIC_ACCESS }
        - { path: ^/api/newsletter, roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/contact, roles: PUBLIC_ACCESS }
        - { path: ^/api/stats, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_USER }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
