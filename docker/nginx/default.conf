# Vhost Nginx pour l'API Symfony, servie via PHP-FPM (conteneur "backend").
# Même logique que la config Nginx classique décrite dans DEPLOIEMENT-CONTABO.md,
# adaptée pour transmettre les requêtes PHP à un conteneur (backend:9000) au
# lieu d'un socket Unix local.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/zonal_access.log;
    error_log /var/log/nginx/zonal_error.log;
}
